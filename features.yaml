# Feature checklist — the contract between "what the app claims" and "what a test proves".
# status: planned | in-progress | done. A `done` feature must list ≥ 1 existing, non-skipped test as file#title.
# scripts/check-features.ts enforces this in CI and renders docs/ACCEPTANCE.md.
- id: F-001
  title: Capture bar (focused on open, Enter appends, row flashes, draft kept on failure)
  practice: capture everything (Allen 2001)
  status: done
  tests:
  - e2e/capture.spec.ts#[F-001] page opens with the bar focused; Enter adds a row within 500 ms; it is on disk and survives a reload
  - src/web/components/CaptureBar.test.tsx#[F-001] the bar is focused on mount
- id: F-002
