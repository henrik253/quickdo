  practice: concrete plans remove intrusion (Masicampo & Baumeister 2011)
  status: done
  tests:
  - src/web/components/CaptureBar.test.tsx#[F-002] a warning becomes an amber chip
  - test/server/api.capture.test.ts#[F-002] returns the parsed tokens (chips) and applies them to the item
