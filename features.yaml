# Feature checklist — the contract between "what the app claims" and "what a test proves".
# status: planned | in-progress | done. A `done` feature must list ≥ 1 existing, non-skipped test as file#title.
# scripts/check-features.ts enforces this in CI and renders docs/ACCEPTANCE.md.
- id: F-001
  title: Capture bar (focused on open, Enter appends, row flashes, draft kept on failure)
  practice: capture everything (Allen 2001)
  status: done
  tests:
  - e2e/capture.spec.ts#[F-001] page opens with the bar focused; Enter adds a row within 500 ms; it is on disk and survives a reload
  - src/web/components/CaptureBar.test.tsx#[F-001] the bar is focused on mount
- id: F-002
  title: Quick syntax with live chips
  practice: concrete plans remove intrusion (Masicampo & Baumeister 2011)
  status: done
  tests:
  - src/web/components/CaptureBar.test.tsx#[F-002] a warning becomes an amber chip
  - test/server/api.capture.test.ts#[F-002] returns the parsed tokens (chips) and applies them to the item
- id: F-003
  title: Capture from anywhere (Shortcut hotkey + CLI hit POST /api/capture)
  practice: capture in seconds
  status: done
  tests:
  - e2e/capture.spec.ts#[F-003] a capture posted from outside appears via SSE without a reload
  - src/web/store.test.ts#[F-003] an SSE state event replaces the whole state and marks the stream connected
  manual:
  - Press ⌃⌥Space after a reboot, type a todo, see the notification
- id: F-004
  title: Backlog vs Today plus morning rollover
  practice: separate master list from daily commitment; plan only the next step
  status: done
  tests:
  - e2e/today.spec.ts#[F-004] moving the clock to the next day rolls open Today items to the Backlog with a chip
  - src/web/components/CaptureBar.test.tsx#[F-004] ⌘Enter posts with target today
- id: F-005
